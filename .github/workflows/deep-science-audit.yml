name: Deep science audit

on:
  push:
    branches:
      - roadmap/verified-classification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/spinor_trace_bridge/src
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Root regression suite
        run: python -m pytest tests -o addopts='' -q -rs
      - name: Science input adversarial tests
        run: python science/test_inputs.py
      - name: Saved-evidence closure
        run: python science/verify_science.py

  standalone-rank81:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r science/rank81/requirements.txt
      - name: Recompute all 81 values, Jacobian, rank minor and orbit minor
        run: python science/rank81/verify.py science/rank81/input.json --output /tmp/linux-rank81-certificate.json
      - name: Check Linux certificate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/linux-rank81-certificate.json'))
          assert x['passed'] and len(x['points']) == 1
          p=x['points'][0]
          assert p['prime'] == 50021
          assert p['rank'] == 81 and p['determinant_mod_p'] == 21539
          assert p['orbit_rank'] == 45 and p['orbit_determinant_mod_p'] == 10547
          assert all(sum(a*b for a,b in zip(row,tangent)) % p['prime'] == 0
                     for row in p['jacobian'] for tangent in p['orbit_rows'])
          print('standalone rank/orbit certificate PASS')
          PY

  independent-character:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile D5 character engine
        run: g++ -std=c++17 -O3 -Wall -Wextra science/character/d5_symmetric_character.cpp -o /tmp/d5_character
      - name: Regenerate exact character through degree 22
        run: /tmp/d5_character 22 /tmp/d5
      - name: Independent Python verification through degree 12
        run: python science/character/check_character.py /tmp/d5 --full-through 12 --output /tmp/d5-check.json
      - name: Compare regenerated Hilbert dimensions
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/d5.json'))
          got={int(r['degree']):int(r['invariants']) for r in x['degrees']}
          expected={0:1,1:0,2:0,3:0,4:1,5:0,6:2,7:0,8:7,9:0,10:14,11:0,12:72,13:0,14:247,15:0,16:1364,17:0,18:6851,19:0,20:40170,21:0,22:227979}
          assert got == expected, (got, expected)
          check=json.load(open('/tmp/d5-check.json'))
          assert check['passed']
          print('independent D5 character PASS')
          PY
