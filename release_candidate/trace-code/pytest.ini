[pytest]
# `scripts/` contains helper modules whose names begin with `test_` --
# notably scripts/test_M_only_quotients.py, which is imported BY NAME from
# several runners (`from test_M_only_quotients import registry_items, ...`).
# Bare `pytest` used to collect it alongside tests/test_M_only_quotients.py and
# abort the whole run with a module-name collision:
#
#   import file mismatch: imported module 'test_M_only_quotients' has this
#   __file__ attribute: scripts/test_M_only_quotients.py
#
# Renaming the helper would be the tidier fix but touches every importer, so
# the least disruptive correction is to scope collection. testpaths handles the
# bare `pytest` case; norecursedirs also covers `pytest .` and `pytest --pyargs`
# style invocations that ignore testpaths.
testpaths = tests
norecursedirs = scripts .venv .git .handoff results docs work tmp

# Keep output terse; this suite is long and the interesting part is the tail.
addopts = -q
