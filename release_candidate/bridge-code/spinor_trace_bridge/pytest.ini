[pytest]
# Run this suite from inside spinor_trace_bridge/:
#     cd spinor_trace_bridge && python -m pytest
# Invoking it from the repository root with `-c` does not work: pytest resolves
# testpaths against an inferred rootdir and ends up collecting the tensor-side
# suite under this configuration, where sdinv is not on the path.
testpaths = tests
pythonpath = src
addopts = -q
